<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d37a"/><stop offset=".55" stop-color="#d9b24c"/><stop offset="1" stop-color="#b8902f"/></linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8902f"/><stop offset=".45" stop-color="#f3d37a"/><stop offset="1" stop-color="#b8902f"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a0907"/><stop offset=".5" stop-color="#6e1512"/><stop offset="1" stop-color="#3a0907"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a0c0a"/><stop offset=".5" stop-color="#861c17"/><stop offset="1" stop-color="#4a0c0a"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0604"/><stop offset="1" stop-color="#2a1208"/></linearGradient>
    <pattern id="diamonds" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M14 6 L19 14 L14 22 L9 14Z" fill="#d9b24c" opacity=".28"/></pattern>
  </defs>
  <ellipse cx="200" cy="364" rx="170" ry="12" fill="#000" opacity=".35"/>
  <!-- the lid, propped open behind the box -->
  <g transform="rotate(-9 200 140)">
    <rect x="52" y="62" width="296" height="54" rx="4" fill="url(#lid)" stroke="url(#gold)" stroke-width="6"/>
    <rect x="183" y="62" width="34" height="54" fill="url(#goldH)" stroke="#7a5a14" stroke-width="2"/>
  </g>
  <!-- the empty inside -->
  <path d="M62 174 L 90 138 L 310 138 L 338 174Z" fill="url(#inside)" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M90 138 L 90 150 M310 138 L 310 150" stroke="#d9b24c" stroke-opacity=".4" stroke-width="2"/>
  <rect x="62" y="172" width="276" height="186" rx="4" fill="url(#body)" stroke="url(#gold)" stroke-width="6"/>
  <rect x="65" y="175" width="270" height="180" fill="url(#diamonds)"/>
  <rect x="80" y="190" width="240" height="150" fill="none" stroke="#d9b24c" stroke-opacity=".55" stroke-width="2"/>
  <rect x="183" y="172" width="34" height="186" fill="url(#goldH)" stroke="#7a5a14" stroke-width="2"/>
</svg>
